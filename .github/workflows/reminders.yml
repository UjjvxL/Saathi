# Runs Saathi's reminder engine every 5 minutes for free.
#
# Vercel's free (Hobby) plan only allows a cron job once a day, so this workflow calls the
# reminder endpoint instead. To switch it on, add two repository secrets in GitHub
# (Settings → Secrets and variables → Actions → New repository secret):
#   APP_URL      your live address, e.g. https://saathi.vercel.app
#   CRON_SECRET  the same CRON_SECRET you set in Vercel
#
# Notes: GitHub may start scheduled runs a few minutes late at busy times, and only runs them on
# the default branch. It's free for public repositories; for a private one, cron-job.org is a
# better fit (see README).
name: Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  run:
    name: Check and send reminders
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the APP_URL and CRON_SECRET repository secrets to switch reminders on."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 --retry-delay 5 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/reminders"
          echo
